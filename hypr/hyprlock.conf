general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/mello/Pictures/miyamoto-musashi-3840x2160-15204.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
    contrast = 0.9
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.4
    outer_color = rgba(232, 230, 225, 0.9)
    inner_color = rgba(10, 10, 10, 0.8)
    font_color = rgba(232, 230, 225, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    rounding = 0
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    color = rgba(232, 230, 225, 0.95)
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    color = rgba(120, 118, 110, 0.85)
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
