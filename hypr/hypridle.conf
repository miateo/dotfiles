general {
    lock_cmd = pidof hyprlock || hyprlock         # avoid double-launch
    before_sleep_cmd = loginctl lock-session       # lock before it suspends
    after_sleep_cmd = hyprctl dispatch dpms on     # wake displays on resume
}

# Lock after 5 min idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn screen off 5 min after that (10 min total)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
