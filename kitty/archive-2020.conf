# Archive (2020) palette — generated by palette.sh; do not edit by hand
foreground            #e8e6e1
background            #0a0a0a
cursor                #e8e6e1
cursor_text_color     #0a0a0a
selection_foreground  #0a0a0a
selection_background  #e8e6e1
url_color             #787670

# 16-colour table. Smoke for "normal" slots, amber only for "warning" slots
# (red + yellow indices), dim smoke for blue/magenta. No real reds, greens,
# blues — keeps shell output consistent with the no-chroma rule.
color0   #0a0a0a
color8   #787670
color1   #ffb000
color9   #ffb000
color2   #e8e6e1
color10  #e8e6e1
color3   #ffb000
color11  #ffb000
color4   #787670
color12  #787670
color5   #787670
color13  #787670
color6   #787670
color14  #e8e6e1
color7   #e8e6e1
color15  #e8e6e1

# ── Font (archive-2020) ─────────────────────────────────────
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         11.0
disable_ligatures cursor

# ── Cursor + window chrome (archive-2020) ───────────────────
cursor_shape            block
cursor_blink_interval   0
window_padding_width    8
hide_window_decorations yes

# ── Tab bar — inverted highlight on active tab ──────────────
tab_bar_style           separator
tab_separator           " │ "
active_tab_foreground   #000000
active_tab_background   #e8e6e1
active_tab_font_style   normal
inactive_tab_foreground #787670
inactive_tab_background #0a0a0a
inactive_tab_font_style normal

# ── Bell (archive-2020) ─────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.08
visual_bell_color    #ffb000
